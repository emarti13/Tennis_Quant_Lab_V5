name: V5 Player State

on:
  push:
    branches: [main]
    paths:
      - 'v5_player_state.py'
      - 'tests/test_v5_player_state.py'
      - '.github/workflows/v5_player_state.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_v5_player_state.py -v
