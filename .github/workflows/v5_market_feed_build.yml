name: V5 Market Feed Build

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["OddsPapi Normalized Daily v2"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest normalized OddsPapi artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: oddspapi_normalized_daily_v2.yml
          name: v5-normalized-market-snapshot
          path: .
          workflow_conclusion: success
          if_no_artifact_found: fail

      - name: Build V5-ready market feed
        run: python build_v5_market_board_input.py

      - name: Commit current market feed for Streamlit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v5_market_ready/market_board_input.csv v5_market_ready/market_feed_qc.json
          if git diff --cached --quiet; then
            echo "No market-feed changes to commit."
          else
            git commit -m "Update V5 market feed"
            git push
          fi

      - name: Upload V5-ready market feed
        uses: actions/upload-artifact@v4
        with:
          name: v5-market-ready
          path: v5_market_ready/
          if-no-files-found: error
