name: State Confidence Gate Audit

on:
  push:
    branches:
      - diagnostics/state-confidence-gate-audit
    paths:
      - 'diagnose_signal_confidence_gate.py'
      - 'run_signal_confidence_gate_audit.py'
      - 'diagnose_live_review_root_causes.py'
      - 'tests/test_signal_confidence_gate_diagnostic.py'
      - '.github/workflows/state_confidence_gate_audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v5-research-state-confidence-gate
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install focused dependencies
        run: pip install pandas numpy pytest pyarrow
      - name: Test diagnostic contract
        run: python -m pytest tests/test_signal_confidence_gate_diagnostic.py -q
      - name: Run frozen-history audit
        run: python run_signal_confidence_gate_audit.py
      - name: Trace live REVIEW root causes
        run: python diagnose_live_review_root_causes.py
      - name: Persist audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/acceptance/signal_confidence_gate_audit.json docs/experiments/2026-09-14-signal-confidence-gate.md docs/experiments/2026-09-14-live-review-root-cause.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record confidence and live REVIEW diagnostics'
            git push origin HEAD:diagnostics/state-confidence-gate-audit
          fi
