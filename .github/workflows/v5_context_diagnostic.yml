name: V5 Context Model Diagnostic

on:
  push:
    branches: [main, feature/complete-superpowers-v5]
    paths:
      - 'diagnose_v5_context_model.py'
      - 'diagnose_v5_advanced_model.py'
      - 'build_v5_context_matchups.py'
      - 'build_v5_context_warehouse.py'
      - 'build_v5_venue_registry.py'
      - 'build_v5_weather_cache.py'
      - 'v5_context_model.py'
      - 'v5_advanced_model.py'
      - 'v5_weather_features.py'
      - 'v5_rolling_stats.py'
      - 'v5_workload_features.py'
      - 'v5_player_state.py'
      - 'v5_matchup_features.py'
      - 'v5_model_calibration.py'
      - 'v5_travel_features.py'
      - 'v5_venue_metadata.py'
      - 'v5_tournament_registry.py'
      - 'v5_court_speed.py'
      - 'tests/test_v5_context_diagnostic.py'
      - 'tests/test_v5_context_model.py'
      - 'tests/test_v5_context_matchups.py'
      - 'tests/test_v5_advanced_model.py'
      - 'tests/test_build_v5_weather_cache.py'
      - '.github/workflows/v5_context_diagnostic.yml'
  workflow_dispatch:

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Verify model contracts
        run: |
          python -m pytest tests/test_v5_context_diagnostic.py tests/test_v5_context_model.py tests/test_v5_context_matchups.py tests/test_v5_advanced_model.py tests/test_build_v5_weather_cache.py -v
      - name: Build 2023-2026 context warehouse
        run: python build_v5_context_warehouse.py
      - name: Build year-aware venue registry
        run: python build_v5_venue_registry.py
      - name: Build batched 2025-2026 historical weather cache
        run: python build_v5_weather_cache.py
      - name: Run 2025 fit / 2026 validation
        run: python diagnose_v5_context_model.py
      - name: Run nested residual uncertainty ensemble validation
        run: python diagnose_v5_advanced_model.py
      - name: Print compact report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('v5_context_diagnostic/report.json').read_text())
          a=json.loads(Path('v5_advanced_diagnostic/report.json').read_text())
          print('VENUE_REGISTRY_ROWS', r.get('venue_registry_rows'))
          print('WEATHER_CACHE_ROWS', r.get('weather_cache_rows'))
          print('JOIN_QC', json.dumps(r['join_qc'], sort_keys=True))
          print('MATCHED_BY_YEAR', json.dumps(r['matched_by_year'], sort_keys=True))
          print('FLIPS', json.dumps(r.get('combined_2026_winner_call_flips',{}), sort_keys=True))
          for tour,data in r['tours'].items():
              print('TOUR',tour,'STATUS',data.get('status'))
              if data.get('status')=='evaluated':
                  print('MODELS',json.dumps(data['models'],sort_keys=True))
                  print('ABLATIONS',json.dumps(data['ablations'],sort_keys=True))
          print('ADVANCED_PRODUCTION_GATE',json.dumps(a['production_gate'],sort_keys=True))
          for tour,data in a['tours'].items():
              print('ADVANCED',tour,data['selected_candidate'],json.dumps(data['metrics_2026'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v5-context-diagnostic
          path: |
            v5_context_diagnostic/report.json
            v5_context_diagnostic/validation_predictions_2026.csv
            v5_context_diagnostic/prediction_flips_2026.csv
            v5_context_diagnostic/matched_context_rows.parquet
            v5_advanced_diagnostic/report.json
            v5_advanced_diagnostic/advanced_predictions_2026.csv
            v5_advanced_diagnostic/production_candidate.json
            context_warehouse/source_manifest.json
            context_warehouse/schema.json
            context_registry/tournaments.csv
            context_registry/venue_registry_report.json
            context_weather/weather_by_event_date.parquet
            context_weather/weather_cache_report.json
          retention-days: 14
