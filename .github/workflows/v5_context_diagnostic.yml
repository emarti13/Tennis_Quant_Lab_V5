name: V5 Context Model Diagnostic

on:
  push:
    branches: [main, feature/complete-superpowers-v5]
    paths:
      - 'diagnose_v5_context_model.py'
      - 'diagnose_v5_advanced_model.py'
      - 'diagnose_v5_score_distribution.py'
      - 'build_v5_context_matchups.py'
      - 'build_v5_context_warehouse.py'
      - 'build_v5_venue_registry.py'
      - 'build_v5_weather_cache.py'
      - 'v5_context_model.py'
      - 'v5_advanced_model.py'
      - 'v5_score_distribution.py'
      - 'v5_score_walkforward.py'
      - 'v5_weather_features.py'
      - 'v5_rolling_stats.py'
      - 'v5_workload_features.py'
      - 'v5_player_state.py'
      - 'v5_matchup_features.py'
      - 'v5_model_calibration.py'
      - 'v5_travel_features.py'
      - 'v5_venue_metadata.py'
      - 'v5_tournament_registry.py'
      - 'v5_court_speed.py'
      - 'v5_daily_batch.py'
      - 'tests/test_v5_context_diagnostic.py'
      - 'tests/test_v5_context_model.py'
      - 'tests/test_v5_context_matchups.py'
      - 'tests/test_v5_advanced_model.py'
      - 'tests/test_v5_score_walkforward.py'
      - 'tests/test_v5_score_production_promotion.py'
      - 'tests/test_build_v5_weather_cache.py'
      - '.github/workflows/v5_context_diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run complete full-context acceptance pipeline
        id: validation
        continue-on-error: true
        env:
          V5_SCORE_DIAGNOSTIC_SIMS: '80'
        run: |
          set -o pipefail
          {
            echo '=== MODEL CONTRACTS ==='
            python -m pytest tests/test_v5_context_diagnostic.py tests/test_v5_context_model.py tests/test_v5_context_matchups.py tests/test_v5_advanced_model.py tests/test_v5_score_walkforward.py tests/test_v5_score_production_promotion.py tests/test_build_v5_weather_cache.py -v
            echo '=== CONTEXT WAREHOUSE ==='
            python build_v5_context_warehouse.py
            echo '=== VENUE REGISTRY ==='
            python build_v5_venue_registry.py
            echo '=== HISTORICAL WEATHER ==='
            python build_v5_weather_cache.py
            echo '=== CONTEXT 2025 FIT / 2026 VALIDATION ==='
            python diagnose_v5_context_model.py
            echo '=== ADVANCED NESTED VALIDATION ==='
            python diagnose_v5_advanced_model.py
            echo '=== SCORE DISTRIBUTION 2025 FIT / 2026 VALIDATION ==='
            python diagnose_v5_score_distribution.py
          } 2>&1 | tee /tmp/full-context-validation.txt
      - name: Persist acceptance evidence
        if: always() && github.ref == 'refs/heads/feature/complete-superpowers-v5'
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/full-context-artifacts
          cp /tmp/full-context-validation.txt /tmp/full-context-artifacts/validation.txt || true
          cp v5_context_diagnostic/report.json /tmp/full-context-artifacts/context_model_report.json || true
          cp v5_advanced_diagnostic/report.json /tmp/full-context-artifacts/advanced_model_report.json || true
          cp v5_advanced_diagnostic/production_candidate.json /tmp/full-context-artifacts/production_candidate.json || true
          cp v5_score_diagnostic/report.json /tmp/full-context-artifacts/score_model_report.json || true
          cp v5_score_diagnostic/production_candidate.json /tmp/full-context-artifacts/score_production_candidate.json || true
          git pull --rebase origin feature/complete-superpowers-v5
          mkdir -p experiments/acceptance
          python - <<'PY'
          import json, os
          from pathlib import Path
          log_path=Path('/tmp/full-context-artifacts/validation.txt')
          text=log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
          Path('experiments/acceptance/context_diagnostic_status.json').write_text(json.dumps({
              'status': os.environ['VALIDATION_OUTCOME'],
              'expected': 'success',
              'log_tail': text[-20000:],
          }, indent=2))
          PY
          if [ "$VALIDATION_OUTCOME" = "success" ]; then
            cp /tmp/full-context-artifacts/context_model_report.json experiments/acceptance/context_model_report.json
            cp /tmp/full-context-artifacts/advanced_model_report.json experiments/acceptance/advanced_model_report.json
            cp /tmp/full-context-artifacts/production_candidate.json experiments/acceptance/production_candidate.json
            cp /tmp/full-context-artifacts/score_model_report.json experiments/acceptance/score_model_report.json
            cp /tmp/full-context-artifacts/score_production_candidate.json experiments/acceptance/score_production_candidate.json
          fi
          git add experiments/acceptance/context_diagnostic_status.json
          if [ "$VALIDATION_OUTCOME" = "success" ]; then
            git add experiments/acceptance/context_model_report.json experiments/acceptance/advanced_model_report.json experiments/acceptance/production_candidate.json experiments/acceptance/score_model_report.json experiments/acceptance/score_production_candidate.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record full-context production acceptance evidence'
            git push origin HEAD:feature/complete-superpowers-v5
          fi
      - name: Enforce acceptance gate
        if: steps.validation.outcome != 'success'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-context-diagnostic
          path: |
            v5_context_diagnostic/report.json
            v5_context_diagnostic/validation_predictions_2026.csv
            v5_context_diagnostic/prediction_flips_2026.csv
            v5_context_diagnostic/matched_context_rows.parquet
            v5_advanced_diagnostic/report.json
            v5_advanced_diagnostic/advanced_predictions_2026.csv
            v5_advanced_diagnostic/production_candidate.json
            v5_score_diagnostic/report.json
            v5_score_diagnostic/production_candidate.json
            context_warehouse/source_manifest.json
            context_warehouse/schema.json
            context_registry/tournaments.csv
            context_registry/venue_registry_report.json
            context_weather/weather_by_event_date.parquet
            context_weather/weather_cache_report.json
          if-no-files-found: warn
          retention-days: 14