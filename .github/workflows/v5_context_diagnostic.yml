name: V5 Context Model Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/rerun-context-walkforward-2026-09-15
    paths:
      - '.github/workflows/v5_context_diagnostic.yml'

permissions:
  contents: read

jobs:
  context-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt pytest
      - name: Verify market comparison logic
        run: python -m pytest tests/test_consensus_line_analysis.py tests/test_context_market_ab.py -v
      - name: Restore canonical OddsPapi tennis market metadata
        uses: actions/cache@v4
        with:
          path: oddspapi_markets_tennis.json
          key: oddspapi-tennis-markets-v1
      - name: Validate market metadata
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          p = Path('oddspapi_markets_tennis.json')
          def valid():
              if not p.exists() or p.stat().st_size == 0: return False
              try:
                  x=json.loads(p.read_text()); return isinstance(x,list) and len(x)>0
              except Exception: return False
          if not valid(): subprocess.run([sys.executable,'fetch_oddspapi_markets.py'],check=True)
          if not valid(): raise SystemExit('No valid OddsPapi tennis market metadata available')
          PY
      - name: Restore expensive context prerequisites
        id: context-cache
        uses: actions/cache@v4
        with:
          path: |
            context_warehouse
            v5_context_diagnostic
          key: consensus-context-prereqs-2026-09-15-v1
      - name: Build context prerequisites only on cache miss
        if: steps.context-cache.outputs.cache-hit != 'true'
        run: |
          python build_v5_context_warehouse.py
          python build_v5_venue_registry.py
          python build_v5_weather_cache.py
          python diagnose_v5_context_model.py
      - name: Run enhanced versus baseline market A/B
        env:
          V5_SCORE_DIAGNOSTIC_SIMS: '80'
        run: python context_market_ab_probe.py
      - name: Preserve A/B result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-context-market-ab-2026
          if-no-files-found: warn
          path: experiments/acceptance/context_market_ab_2026_report.json
