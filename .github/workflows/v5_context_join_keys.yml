name: V5 Context Join Keys

on:
  push:
    branches: [feature/v5-full-context-model]
    paths:
      - 'diagnose_context_join_keys.py'
      - '.github/workflows/v5_context_join_keys.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python diagnose_context_join_keys.py
