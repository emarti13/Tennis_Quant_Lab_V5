name: V5 Context Join Keys

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_v5_context_walkforward_dates.py tests/test_v5_context_timezone_keys.py -v
      - run: python diagnose_context_join_keys.py
