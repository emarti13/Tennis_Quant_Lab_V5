name: V5 Today UI Host Integration

on:
  push:
    branches: [feature/apple-today-ui]
    paths:
      - 'scripts/apply_apple_today_host_integration.py'
      - '.github/workflows/v5_ui_host_integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic host patch
        run: python scripts/apply_apple_today_host_integration.py
      - name: Commit host integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tennis_quant_app_v5.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat: wire Today-first UI into Streamlit host'
            git push origin HEAD:feature/apple-today-ui
          fi
