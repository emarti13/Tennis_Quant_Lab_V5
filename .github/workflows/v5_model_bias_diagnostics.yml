name: V5 Model Bias Diagnostics

on:
  push:
    branches:
      - main
    paths:
      - "diagnose_v5_selection_bias.py"
      - "diagnose_slam_market_ranges.py"
      - "diagnose_walkforward_model_scale.py"
      - "diagnose_state_variation_effect.py"
      - "diagnose_fixture_result_fields.py"
      - "v5_core.py"
      - "v5_live_market.py"
      - "v5_daily_batch.py"
      - "tests/test_v5_daily_batch.py"
      - "tests/test_v5_market_line_pricing.py"
      - ".github/workflows/v5_model_bias_diagnostics.yml"
      - "v5_daily_ready/latest_board.csv"
      - "v5_men_walkforward.csv"
      - "v5_wta_walkforward.csv"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily batch regression tests
        run: python -m unittest discover -s tests -p 'test_v5_daily_batch.py' -v
      - name: Run exact market line pricing tests
        run: python -m unittest discover -s tests -p 'test_v5_market_line_pricing.py' -v
      - name: Run board bias audit
        run: python diagnose_v5_selection_bias.py
      - name: Audit mens Slam market line ranges
        run: python diagnose_slam_market_ranges.py
      - name: Evaluate walk-forward model scale
        run: python diagnose_walkforward_model_scale.py
      - name: Measure state volatility effect
        run: python diagnose_state_variation_effect.py
      - name: Inspect retained fixture result fields
        run: python diagnose_fixture_result_fields.py
      - name: Show audit output
        run: |
          cat v5_daily_ready/model_bias_diagnostic.json
          cat v5_daily_ready/slam_market_range_diagnostic.json
          cat v5_daily_ready/walkforward_model_scale_diagnostic.json
          cat v5_daily_ready/state_variation_diagnostic.json
