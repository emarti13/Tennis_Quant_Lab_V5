name: V5 Model Bias Diagnostics

# Research/audit workflow. Run intentionally when selection-bias or calibration
# analysis is needed. Production data commits must not fan out into this job.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Run focused audit contracts
        run: |
          python -m pytest tests/test_v5_daily_batch.py tests/test_v5_market_line_pricing.py tests/test_v5_settled_performance.py -q
      - name: Audit settled and fixture-clustered performance
        run: python diagnose_v5_settled_performance.py
