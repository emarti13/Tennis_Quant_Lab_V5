name: Research - Kalshi data shapes

# One-off, read-only (public Kalshi API, no key). Runs only on pushes to its research branch.
on:
  push:
    branches: [research/step3b-kalshi-shapes]
    paths: [scripts/probe_kalshi_shapes.py]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check requests
      - run: python scripts/probe_kalshi_shapes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/kalshi_shapes.json
          git commit -m "Kalshi shapes" && git push origin HEAD:research/step3b-kalshi-shapes
