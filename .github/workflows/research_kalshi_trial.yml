name: Research - Kalshi collector trial

# One-off trial (public Kalshi API, no key). Runs only on pushes to its research branch.
on:
  push:
    branches: [research/step3b-kalshi-trial]
    paths: [.github/workflows/research_kalshi_trial.yml]

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check requests pandas
      - name: Collector, 3 minutes
        run: python scripts/pull_kalshi_history.py --max-minutes 3
      - name: Do old markets still have candles and trades?
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts"); sys.path.insert(0, ".")
          import pandas as pd
          from pull_kalshi_history import Kalshi
          k = Kalshi(); out = {}
          for label, a, b in (("jan", "2026-01-10", "2026-01-12"), ("jun", "2026-06-10", "2026-06-12"), ("sep", "2026-09-10", "2026-09-12")):
              ms = k.settled("KXATPMATCH", int(pd.Timestamp(a, tz="UTC").timestamp()), int(pd.Timestamp(b, tz="UTC").timestamp()))
              row = {"markets": len(ms)}
              if ms:
                  m = max(ms, key=lambda x: float(x.get("volume_fp") or 0))
                  c = k.candles("KXATPMATCH", m["ticker"], pd.Timestamp(m["open_time"]), pd.Timestamp(m["close_time"]))
                  t, trunc = k.trades(m["ticker"], int(pd.Timestamp(m["occurrence_datetime"]).timestamp()))
                  row.update(ticker=m["ticker"], candles=len(c), pre_start_trades=len(t), truncated=trunc)
              out[label] = row
          json.dump(out, open("market_history/kalshi/retention_trial.json", "w"), indent=1)
          print(out)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A market_history
          git commit -m "Kalshi trial outputs" && git push origin HEAD:research/step3b-kalshi-trial
