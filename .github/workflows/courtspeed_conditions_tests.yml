name: CourtSpeed Conditions Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "v5_courtspeed_fetch.py"
      - "v5_refresh_court_conditions.py"
      - "v5_court_conditions_source.py"
      - "v5_full_context_live.py"
      - "tests/test_v5_courtspeed_refresh.py"
      - "tests/test_v5_court_conditions_resolution.py"
      - "tests/test_v5_court_conditions_integration.py"
      - ".github/workflows/courtspeed_conditions_*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest lxml
      - run: |
          pytest \
            tests/test_v5_courtspeed_refresh.py \
            tests/test_v5_court_conditions_source.py \
            tests/test_v5_court_conditions_resolution.py \
            tests/test_v5_court_conditions_integration.py \
            tests/test_v5_court_conditions_no_network.py -q
