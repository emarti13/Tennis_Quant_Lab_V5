name: V5 Margin Calibration Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - "diagnose_margin_calibration.py"
      - "historical_score_calibration.py"
      - "v5_strength_conditioning.py"
      - ".github/workflows/v5_margin_calibration_diagnostic.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fit 2025 margin strength and validate on 2026
        run: python diagnose_margin_calibration.py
      - name: Show diagnostic
        run: cat v5_daily_ready/margin_calibration_diagnostic.json
