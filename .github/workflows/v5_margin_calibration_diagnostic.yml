name: V5 Margin Calibration Diagnostic

# Research-only diagnostic. Run intentionally when margin calibration changes.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Fit 2025 margin strength and validate on 2026
        run: python diagnose_margin_calibration.py
      - name: Show diagnostic
        run: cat v5_daily_ready/margin_calibration_diagnostic.json
