name: Export Kalshi Training Dataset

on:
  push:
    paths:
      - "scripts/export_kalshi_training_dataset.py"
      - ".github/workflows/export_kalshi_training_dataset.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas

      - name: Build compact training exports
        run: python scripts/export_kalshi_training_dataset.py

      - name: Upload training exports
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-training-dataset
          path: |
            exports/kalshi_training_matches.csv
            exports/kalshi_training_sides.csv
            exports/kalshi_training_export_qc.json
          retention-days: 7

      - name: Commit exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/kalshi_training_matches.csv exports/kalshi_training_sides.csv exports/kalshi_training_export_qc.json
          if git diff --cached --quiet; then
            echo "No export changes."
          else
            git commit -m "Refresh Kalshi training dataset export"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
