name: Temporary Schedule Court Patch

on:
  push:
    branches:
      - "feature/schedule-court-dynamics"
    paths:
      - ".github/workflows/temporary_schedule_court_patch.yml"
      - ".tmp_schedule_parts/**"
      - "scripts/restore_exact_schedule.py"
      - "scripts/apply_schedule_court_patch.py"
      - "v5_schedule_context.py"
      - "tests/test_v5_schedule_context.py"
      - "tests/test_v5_schedule_court_speed.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/schedule-court-dynamics
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Restore exact uploaded schedule
        run: python scripts/restore_exact_schedule.py
      - name: Apply integration patch
        run: python scripts/apply_schedule_court_patch.py
      - name: Run targeted tests
        run: PYTHONPATH=. pytest -q tests/test_v5_schedule_context.py tests/test_v5_schedule_court_speed.py tests/test_v5_court_speed.py tests/test_v5_context_matchups.py
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add context_registry/tennis_master_schedule.csv build_v5_context_matchups.py v5_court_speed.py
          if git diff --cached --quiet; then
            echo "Verified integration produced no file changes."
            exit 0
          fi
          git commit -m "feat: integrate schedule structural court dynamics"
          git push origin HEAD:feature/schedule-court-dynamics
