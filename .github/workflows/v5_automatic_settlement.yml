name: V5 Automatic Settlement

# One daily settlement run plus manual recovery. Routine code/data pushes do not
# launch settlement or its performance audit.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * *"

permissions:
  contents: write

concurrency:
  group: v5-daily-settlement
  cancel-in-progress: true

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install production dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Settle frozen predictions
        run: python v5_settlement.py

      - name: Build fixture-clustered performance audit
        run: python diagnose_v5_settled_performance.py

      - name: Show settlement summary
        if: always()
        run: |
          if [ -f v5_daily_ready/settlement_summary.json ]; then cat v5_daily_ready/settlement_summary.json; fi

      - name: Commit settlement updates safely
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during settlement; rerunning against latest ledger."
            git reset --hard origin/main
            python v5_settlement.py
            python diagnose_v5_settled_performance.py
          fi
          git add v5_daily_ready/frozen_predictions.csv \
                  v5_daily_ready/settlement_summary.json \
                  v5_daily_ready/settled_performance_audit.json
          if git diff --cached --quiet; then
            echo "No settlement changes to commit."
          else
            git commit -m "Settle V5 frozen predictions and refresh performance"
            git push origin HEAD:main
          fi
