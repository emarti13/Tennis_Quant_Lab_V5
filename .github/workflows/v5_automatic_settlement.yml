name: V5 Automatic Settlement

# One daily production settlement plus manual recovery. Run after the final
# TennisMyLife/player-history recovery window so delayed upstream recovery can
# still settle Results the same day. Official recommendation performance is
# sourced only from the canonical official ledger; Results Accuracy is sourced
# from the settled frozen fixture forecast ledger.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"

permissions:
  contents: write

concurrency:
  group: v5-production-writer
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install production dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Settle official recommendations and frozen fixture forecasts
        run: python v5_settle_official_recommendations.py

      - name: Show settlement status
        if: always()
        run: |
          for f in \
            v5_results_ready/results_status.json \
            v5_daily_ready/official_settlement_status.json \
            v5_daily_ready/official_performance.json
          do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done

      - name: Commit settlement updates safely
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in \
            v5_daily_ready/official_recommendations.csv \
            v5_daily_ready/frozen_predictions.csv \
            v5_daily_ready/official_performance.json \
            v5_daily_ready/official_settlement_status.json
          do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No settlement changes to commit."
            exit 0
          fi
          git commit -m "Settle V5 recommendations and forecasts"
          git pull --rebase origin main
          git push origin HEAD:main
