name: V5 Automatic Settlement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v5_settlement.py"
      - "results_accuracy_page.py"
      - "pages/**"
      - "tests/test_v5_settlement.py"
      - "tests/test_results_accuracy.py"
      - ".github/workflows/v5_automatic_settlement.yml"
  workflow_run:
    workflows: ["V5 Player Ratings Refresh"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: v5-automatic-settlement-v2
  cancel-in-progress: true

jobs:
  settle:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run settlement tests
        run: python -m unittest discover -s tests -v

      - name: Settle frozen predictions
        run: python v5_settlement.py

      - name: Show settlement summary
        if: always()
        run: |
          if [ -f v5_daily_ready/settlement_summary.json ]; then
            cat v5_daily_ready/settlement_summary.json
          fi

      - name: Commit settlement updates safely
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during settlement; rerunning against the latest ledger."
            git reset --hard origin/main
            python -m unittest discover -s tests -v
            python v5_settlement.py
          fi

          git add v5_daily_ready/frozen_predictions.csv \
                  v5_daily_ready/settlement_summary.json
          if git diff --cached --quiet; then
            echo "No settlement changes to commit."
          else
            git commit -m "Settle V5 frozen predictions"
            git push origin HEAD:main
          fi
