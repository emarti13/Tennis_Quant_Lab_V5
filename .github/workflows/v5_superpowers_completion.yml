name: V5 Superpowers Completion Gate

# Legacy project-completion gate retained for manual historical verification.
# The active repository gate is the PR full-regression workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Run full Superpowers repository gate
        run: python -m pytest tests -q
