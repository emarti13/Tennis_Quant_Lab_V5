name: Diagnose OddsPapi quota

on:
  push:
    branches: [fix/market-feed-resilience]
    paths:
      - '.github/workflows/diagnose_oddspapi_quota.yml'
  workflow_dispatch:

jobs:
  quota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Read sanitized quota state
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python - <<'PY'
          import json
          from oddspapi_client import OddsPapiClient
          from pull_oddspapi_quota_aware import quota_state
          print(json.dumps(quota_state(OddsPapiClient().account()), indent=2))
          PY
