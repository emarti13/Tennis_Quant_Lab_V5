name: V5 Today Matchup Parity CI

on:
  push:
    branches: [feature/today-matchup-parity-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved Today parity implementation
        run: python scripts/apply_today_matchup_parity.py
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run complete repository regression
        run: python -m pytest tests -q
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tennis_quant_app_v5.py v5_ui_host.py v5_ui_today.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add Matchup Lab output to Today cards [skip ci]'
            git push origin HEAD:feature/today-matchup-parity-v2
          fi
