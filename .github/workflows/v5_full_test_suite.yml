name: V5 Full Regression Suite

# Full repository regression is a code-change gate, not a production-data job.
# Pull requests get one full verification run; manual dispatch remains available
# for release/recovery checks. Artifact/data commits to main do not fan out here.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'experiments/acceptance/production_candidate.json'
      - 'experiments/acceptance/score_production_candidate.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: v5-full-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run complete test suite
        run: python -m pytest tests -q
