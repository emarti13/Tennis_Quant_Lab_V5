name: Apply Legacy Court Retirement

on:
  push:
    branches: [main]
    paths:
      - 'retire_legacy_court_paths.py'
      - '.github/workflows/v5_apply_legacy_court_retirement.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v5-legacy-court-retirement
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize main
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest
      - name: Apply retirement migration
        run: python retire_legacy_court_paths.py
      - name: Verify retirement and authority contracts
        run: |
          python -m pytest \
            tests/test_v5_legacy_court_retirement.py \
            tests/test_v5_tournament_authority.py \
            tests/test_v5_tournament_challenger.py \
            tests/test_v5_tournament_score_challenger.py -v
      - name: Commit cutover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            build_v5_context_matchups.py \
            v5_daily_batch.py \
            v5_full_context_live.py \
            .github/workflows/courtspeed_conditions_refresh.yml \
            .github/workflows/courtspeed_conditions_tests.yml
          if git diff --cached --quiet; then
            echo 'Legacy court paths were already retired.'
          else
            git commit -m 'Retire legacy CourtSpeed production paths'
            git push origin HEAD:main
          fi
