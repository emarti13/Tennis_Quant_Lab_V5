name: V5 Unified Production UI CI

on:
  push:
    branches: [fix/unify-production-ui-settlement]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply production implementation
        run: python scripts/apply_unified_production_ui.py
      - run: pip install -r requirements.txt pytest
      - name: Run complete repository regression
        run: python -m pytest tests -q
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5_daily_batch.py v5_ui_today.py v5_ui_host.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: unify Today with full-context production engine [skip ci]'
            git push origin HEAD:fix/unify-production-ui-settlement
          fi
