name: V5 Unified Production UI CI

on:
  push:
    branches: [fix/unify-production-ui-settlement]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_v5_production_ui_unification.py tests/test_v5_settlement.py tests/test_v5_settled_performance.py -q
