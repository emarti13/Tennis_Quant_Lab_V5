name: V5 Score Architecture Diagnostic

# Heavy research validation. Run only when score architecture is intentionally
# being evaluated; ordinary pushes are covered by PR regression.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Verify score contracts
        run: python -m pytest tests/test_historical_score_calibration.py tests/test_v5_score_architecture.py -q
      - name: Run 2025 fit / 2026 score architecture validation
        run: python diagnose_v5_score_architecture.py
      - name: Print production gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('v5_score_diagnostic/report.json').read_text())
          for segment,data in r['segments'].items():
              print(segment, json.dumps(data['production_gate'], sort_keys=True))
              print('SELECTED', json.dumps(data['validation_2026_selected'], sort_keys=True))
              print('BASELINE', json.dumps(data['validation_2026_baseline'], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v5-score-architecture-diagnostic
          path: v5_score_diagnostic/report.json
          retention-days: 3
