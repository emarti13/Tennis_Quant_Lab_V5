name: V5 Player Ratings Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: v5-player-ratings-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install production dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Preflight builder
        run: |
          test -f build_v5_states.py
          test -f v5_core.py

      - name: Restore historical TennisMyLife cache
        id: history-cache
        uses: actions/cache/restore@v4
        with:
          path: .v5_history_cache
          key: v5-tennis-history-2010-2025-v3

      - name: Build or restore historical V5 inputs
        run: python bootstrap_v5_history.py

      - name: Save historical TennisMyLife cache
        if: steps.history-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .v5_history_cache
          key: v5-tennis-history-2010-2025-v3

      - name: Refresh current TennisMyLife data and rebuild V5 ratings
        run: python refresh_tennismylife_cloud.py --dir .

      - name: Remove ephemeral historical root copies before commit
        if: always()
        run: rm -f ATP.csv ATPQualifiers.csv Challenger.csv WTA.csv

      - name: Commit refreshed player data and V5 ratings
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          for f in \
            v5_refresh_last.json \
            v5_refresh_log.jsonl \
            v5_men_ratings.csv \
            v5_wta_ratings.csv \
            v5_men_walkforward.csv \
            v5_wta_walkforward.csv \
            v5_build_summary.json
          do
            [ -e "$f" ] && git add "$f"
          done
          git reset -- ATP.csv ATPQualifiers.csv Challenger.csv WTA.csv .v5_history_cache 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No player-data changes to commit."
          else
            git commit -m "Daily V5 player ratings refresh"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload compact refresh audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-player-refresh-audit
          path: v5_refresh_last.json
          if-no-files-found: warn
          retention-days: 3
