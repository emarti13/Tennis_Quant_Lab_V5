name: V5 Player Ratings Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: v5-player-ratings-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide whether this is the active 1 AM Eastern run
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          set +e
          python should_run_1am_eastern.py
          code=$?
          if [ "$code" -eq 78 ]; then
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          echo "run_refresh=true" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        if: steps.gate.outputs.run_refresh == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy requests scikit-learn

      - name: Preflight builder
        if: steps.gate.outputs.run_refresh == 'true'
        run: |
          test -f build_v5_states.py || {
            echo "::error::build_v5_states.py is missing from the repository root."
            exit 1
          }
          test -f v5_core.py || {
            echo "::error::v5_core.py is missing from the repository root."
            exit 1
          }
          echo "V5 builder/runtime found."

      - name: Restore historical TennisMyLife cache
        if: steps.gate.outputs.run_refresh == 'true'
        id: history-cache
        uses: actions/cache/restore@v4
        with:
          path: .v5_history_cache
          key: v5-tennis-history-2010-2025-v3

      - name: Build or restore historical V5 inputs
        if: steps.gate.outputs.run_refresh == 'true'
        run: python bootstrap_v5_history.py

      - name: Save historical TennisMyLife cache
        if: steps.gate.outputs.run_refresh == 'true' && steps.history-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .v5_history_cache
          key: v5-tennis-history-2010-2025-v3

      - name: Refresh current TennisMyLife data and rebuild V5 ratings
        if: steps.gate.outputs.run_refresh == 'true'
        run: python refresh_tennismylife_cloud.py --dir .

      - name: Remove ephemeral historical root copies before commit
        if: steps.gate.outputs.run_refresh == 'true' && always()
        run: rm -f ATP.csv ATPQualifiers.csv Challenger.csv WTA.csv

      - name: Show refresh summary
        if: steps.gate.outputs.run_refresh == 'true' && always()
        run: |
          if [ -f v5_refresh_last.json ]; then cat v5_refresh_last.json; fi

      - name: Commit refreshed player data and V5 ratings
        if: steps.gate.outputs.run_refresh == 'true' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u

          for f in \
            v5_refresh_last.json \
            v5_refresh_log.jsonl \
            v5_men_ratings.csv \
            v5_wta_ratings.csv \
            v5_men_walkforward.csv \
            v5_wta_walkforward.csv \
            v5_build_summary.json
          do
            [ -e "$f" ] && git add "$f"
          done

          git reset -- ATP.csv ATPQualifiers.csv Challenger.csv WTA.csv .v5_history_cache 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No player-data changes to commit."
          else
            git commit -m "Daily V5 player ratings refresh"
            git push
          fi

      - name: Upload refresh audit artifact
        if: steps.gate.outputs.run_refresh == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-player-refresh-audit
          path: |
            v5_refresh_last.json
            v5_refresh_log.jsonl
          if-no-files-found: warn
          retention-days: 14
