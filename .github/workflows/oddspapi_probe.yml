name: OddsPapi Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run OddsPapi probe
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python probe_oddspapi.py

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddspapi-probe-results
          path: |
            oddspapi_account_probe.json
            oddspapi_sports_probe.json
            oddspapi_tournaments_probe.json
            oddspapi_odds_probe.json
          if-no-files-found: warn
