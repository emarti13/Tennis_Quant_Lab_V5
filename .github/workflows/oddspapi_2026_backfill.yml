name: OddsPapi 2026 Historical Backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oddspapi_2026_backfill.yml"
  schedule:
    # Historical work is intentionally kept away from the live-market pull
    # windows (00:15, 12:15, 16:15, 20:15 UTC) because both workflows update
    # the permanent fixture registry. Eight backfill windows/day preserves
    # progress while guaranteeing the live feed gets priority.
    - cron: "45 1,3,5,7,9,13,17,21 * * *"

permissions:
  contents: write

concurrency:
  group: oddspapi-fixture-registry-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run backfill tests
        run: python -m unittest discover -s tests -p 'test_oddspapi_2026_backfill.py' -v

      - name: Discover and permanently checkpoint 2026 fixture index
        if: ${{ hashFiles('oddspapi_history/fixtures_2026.jsonl') == '' }}
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python backfill_oddspapi_2026.py --discover
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oddspapi_history/fixtures_2026.jsonl oddspapi_history/backfill_summary.json
          git commit -m "Cache OddsPapi 2026 fixture index"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fetch next free historical-odds chunk
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python backfill_oddspapi_2026.py --history --history-batch 500

      - name: Sync permanent fixture registry and historical cache status
        run: python sync_oddspapi_registry_history_status.py

      - name: Show backfill summary
        if: always()
        run: |
          if [ -f oddspapi_history/backfill_summary.json ]; then
            cat oddspapi_history/backfill_summary.json
          fi

      - name: Commit historical checkpoint, chunk, and fixture registry
        if: success()
        run: |
          if [ ! -d oddspapi_history ]; then
            echo "No backfill output; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oddspapi_history/ oddspapi_registry/fixtures.csv
          if git diff --cached --quiet; then
            echo "No new historical data or registry changes to commit."
          else
            git commit -m "Backfill OddsPapi history and update fixture registry"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload historical backfill checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddspapi-2026-backfill
          path: |
            oddspapi_history/
            oddspapi_registry/
          if-no-files-found: warn
