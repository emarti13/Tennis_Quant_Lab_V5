name: OddsPapi 2026 Historical Backfill

# Historical enrichment is useful but not production-critical. Keep this
# manual-only while live OddsPapi quota is constrained so research/backfill
# can never consume production pricing capacity automatically.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oddspapi-historical-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lightweight dependencies
        run: pip install --disable-pip-version-check requests

      - name: Discover and permanently checkpoint 2026 fixture index
        if: ${{ hashFiles('oddspapi_history/fixtures_2026.jsonl') == '' }}
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python backfill_oddspapi_2026.py --discover
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oddspapi_history/fixtures_2026.jsonl oddspapi_history/backfill_summary.json
          git commit -m "Cache OddsPapi 2026 fixture index"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fetch next historical-odds chunk
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python backfill_oddspapi_2026.py --history --history-batch 500

      - name: Sync permanent fixture registry and historical cache status
        run: python sync_oddspapi_registry_history_status.py

      - name: Show backfill summary
        if: always()
        run: |
          if [ -f oddspapi_history/backfill_summary.json ]; then cat oddspapi_history/backfill_summary.json; fi

      - name: Commit historical checkpoint, chunk, and fixture registry
        if: success()
        run: |
          if [ ! -d oddspapi_history ]; then
            echo "No backfill output; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oddspapi_history/ oddspapi_registry/fixtures.csv
          if git diff --cached --quiet; then
            echo "No new historical data or registry changes to commit."
          else
            git commit -m "Backfill OddsPapi history and update fixture registry"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload compact historical checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddspapi-2026-backfill
          path: oddspapi_history/backfill_summary.json
          if-no-files-found: warn
          retention-days: 3
