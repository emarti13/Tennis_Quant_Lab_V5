name: Fixture Registry Tests

on:
  push:
    branches:
      - main
      - feature/permanent-oddspapi-fixture-registry
    paths:
      - "oddspapi_fixture_registry.py"
      - "tests/test_oddspapi_fixture_registry.py"
      - "pull_oddspapi_quota_aware.py"
      - "backfill_oddspapi_2026.py"
      - ".github/workflows/oddspapi_normalized_daily_v2.yml"
      - ".github/workflows/fixture_registry_tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fixture registry tests
        run: python -m unittest discover -s tests -p 'test_oddspapi_fixture_registry.py' -v
