name: Fixture Registry Tests

on:
  push:
    branches:
      - main
      - feature/permanent-oddspapi-fixture-registry
      - fix/historical-not-found-terminal
    paths:
      - "oddspapi_fixture_registry.py"
      - "sync_oddspapi_registry_history_status.py"
      - "tests/test_oddspapi_fixture_registry.py"
      - "tests/test_oddspapi_2026_backfill.py"
      - "pull_oddspapi_quota_aware.py"
      - "backfill_oddspapi_2026.py"
      - ".github/workflows/oddspapi_normalized_daily_v2.yml"
      - ".github/workflows/oddspapi_2026_backfill.yml"
      - ".github/workflows/oddspapi_fixture_registry_seed.yml"
      - ".github/workflows/fixture_registry_tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install requests
      - name: Run fixture registry tests
        run: python -m unittest discover -s tests -p 'test_oddspapi_fixture_registry.py' -v
      - name: Run historical retry policy tests
        run: python -m unittest discover -s tests -p 'test_oddspapi_2026_backfill.py' -v
      - name: Compile fixture registry modules
        run: python -m py_compile oddspapi_fixture_registry.py sync_oddspapi_registry_history_status.py backfill_oddspapi_2026.py
