name: Temporary Legacy Feed Patch

on:
  push:
    branches: [fix/legacy-feed-state]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legacy-feed-state
          fetch-depth: 0
      - name: Patch legacy Daily Board feed-state handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tennis_quant_app_v5.py')
          text = path.read_text(encoding='utf-8')
          old = '''    market_feed = load_market_board()\n    all_prices = load_all_book_prices()\n    slate = _oddspapi_daily_slate()\n\n    if slate.empty:\n        st.error(\n            "No repository OddsPapi market feed is available. "\n            "Run the normalized OddsPapi workflow and V5 Market Feed Build."\n        )\n        return\n'''
          new = '''    market_source = load_market_board(include_stale=True)\n    market_feed = load_market_board()\n    all_prices = load_all_book_prices()\n    slate = _oddspapi_daily_slate()\n\n    if market_source.empty:\n        st.error("OddsPapi market artifacts are missing from the repository.")\n        return\n    if slate.empty:\n        st.info("No future eligible fixtures are available in the current OddsPapi snapshot.")\n        return\n'''
          if old not in text:
              raise SystemExit('Expected legacy Daily Board block not found; refusing broad edit')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit surgical patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tennis_quant_app_v5.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: distinguish missing feed from empty future slate"
          git push origin HEAD:fix/legacy-feed-state
