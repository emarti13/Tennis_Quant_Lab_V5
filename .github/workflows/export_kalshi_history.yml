name: Export Kalshi Model History

on:
  push:
    paths:
      - ".github/workflows/export_kalshi_history.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build settled moneyline history CSV
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          src = Path("v5_daily_ready/frozen_predictions.csv")
          out = Path("kalshi_model_market_results.csv")

          def clean(s):
              return (s or "").strip()

          def norm(s):
              s = clean(s).lower()
              if "," in s:
                  last, first = s.split(",", 1)
                  s = f"{first.strip()} {last.strip()}"
              return " ".join(s.replace("-", " ").split())

          matches = {}
          with src.open(newline="", encoding="utf-8") as f:
              for r in csv.DictReader(f):
                  if r.get("market_group") != "moneyline":
                      continue
                  if r.get("result_status") != "SETTLED" or not clean(r.get("result_winner")):
                      continue
                  fid = clean(r.get("fixture_id"))
                  if not fid:
                      continue
                  m = matches.setdefault(fid, {
                      "fixture_id": fid,
                      "match_start_utc": clean(r.get("start_time_utc")),
                      "market_snapshot_utc": clean(r.get("snapshot_utc")),
                      "frozen_at_utc": clean(r.get("frozen_at_utc")),
                      "tournament": clean(r.get("tournament")),
                      "tour": clean(r.get("tour_v5") or r.get("tour")),
                      "surface": clean(r.get("surface")),
                      "player1": clean(r.get("player1")),
                      "player2": clean(r.get("player2")),
                      "model_probability_player1": "",
                      "model_probability_player2": "",
                      "market_decimal_player1": "",
                      "market_decimal_player2": "",
                      "market_american_player1": "",
                      "market_american_player2": "",
                      "market_no_vig_probability_player1": "",
                      "market_no_vig_probability_player2": "",
                      "signal_player1": "",
                      "signal_player2": "",
                      "winner": clean(r.get("result_winner")),
                      "loser": clean(r.get("result_loser")),
                      "score": clean(r.get("result_score")),
                      "model_version": clean(r.get("model_version")),
                  })
                  sel = norm(r.get("selection"))
                  p1 = norm(r.get("player1"))
                  p2 = norm(r.get("player2"))
                  side = None
                  if sel == p1:
                      side = "player1"
                  elif sel == p2:
                      side = "player2"
                  if side:
                      m[f"model_probability_{side}"] = clean(r.get("model_probability"))
                      m[f"market_decimal_{side}"] = clean(r.get("best_decimal_odds"))
                      m[f"market_american_{side}"] = clean(r.get("best_american_odds"))
                      m[f"market_no_vig_probability_{side}"] = clean(r.get("best_book_no_vig_prob"))
                      m[f"signal_{side}"] = clean(r.get("signal"))

          rows = sorted(matches.values(), key=lambda x: (x["match_start_utc"], x["fixture_id"]))
          fields = [
              "fixture_id","match_start_utc","market_snapshot_utc","frozen_at_utc",
              "tournament","tour","surface","player1","player2",
              "model_probability_player1","model_probability_player2",
              "market_decimal_player1","market_decimal_player2",
              "market_american_player1","market_american_player2",
              "market_no_vig_probability_player1","market_no_vig_probability_player2",
              "signal_player1","signal_player2","winner","loser","score","model_version"
          ]
          with out.open("w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(rows)

          complete = sum(
              bool(r["model_probability_player1"] and r["model_probability_player2"]
                   and r["market_decimal_player1"] and r["market_decimal_player2"])
              for r in rows
          )
          summary = {
              "rows": len(rows),
              "complete_two_sided_rows": complete,
              "date_min": rows[0]["match_start_utc"] if rows else None,
              "date_max": rows[-1]["match_start_utc"] if rows else None,
              "source": str(src),
              "market_price_definition": "frozen pre-match best bookmaker price used by V5; not bookmaker opening line"
          }
          Path("kalshi_model_market_results_summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload export
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-model-market-results
          path: |
            kalshi_model_market_results.csv
            kalshi_model_market_results_summary.json
          retention-days: 7
