name: CourtSpeed Conditions Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

concurrency:
  group: v5-production-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Refresh CourtSpeed conditions
        run: python v5_refresh_court_conditions.py

      - name: Run focused CourtSpeed tests
        run: |
          python -m pytest \
            tests/test_v5_courtspeed_refresh.py \
            tests/test_v5_court_conditions_source.py \
            tests/test_v5_court_conditions_resolution.py \
            tests/test_v5_court_conditions_integration.py \
            tests/test_v5_court_conditions_no_network.py -q

      - name: Commit refreshed conditions artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/court_conditions/courtspeed_snapshot.csv data/court_conditions/courtspeed_refresh_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh CourtSpeed conditions snapshot'
            git push origin HEAD:main
          fi
