name: V5 Daily Predictions

# Three recovery windows, but at most one heavy forecast/day unless production
# context inputs/code changed after the frozen forecast. Forecast freshness is
# tied to the exact source commit used to build it, not wall-clock timestamps.
# No push trigger: a context/code change on main is picked up by the next
# window (the freshness check compares against the forecast's source commit).
on:
  workflow_dispatch:
  schedule:
    - cron: "45 6 * * *"
    - cron: "45 10 * * *"
    - cron: "45 14 * * *"

permissions:
  contents: write

concurrency:
  group: v5-production-writer
  cancel-in-progress: false

env:
  V5_HISTORY_MAX_AGE_HOURS: "36"
  V5_CONTEXT_MAX_AGE_HOURS: "36"

jobs:
  build-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout latest production main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Check whether today's canonical forecast already exists
        id: forecast
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          status_path = Path('v5_daily_ready/forecast_status.json')
          forecasts = Path('v5_daily_ready/daily_forecasts.csv')
          now = datetime.now(timezone.utc)
          expected_date = now.astimezone(ZoneInfo('America/New_York')).date().isoformat()
          current_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          fresh = False
          artifact_date = None
          source_commit = ''
          context_newer = True
          context_inputs = [
              'v5_master_schedule_context.py', 'v5_full_context_live.py', 'v5_forecast_context.py',
              'build_v5_context_matchups.py', 'build_v5_context_warehouse.py',
              'context_registry/tennis_master_schedule.csv',
              '.github/workflows/v5_daily_predictions.yml',
          ]
          if status_path.exists() and forecasts.exists() and forecasts.stat().st_size > 0:
              try:
                  payload = json.loads(status_path.read_text(encoding='utf-8'))
                  artifact_date = str(payload.get('forecast_date') or '')
                  source_commit = str(payload.get('source_commit_sha') or '').strip()
                  built = datetime.fromisoformat(str(payload.get('run_timestamp') or '').replace('Z', '+00:00'))
                  if built.tzinfo is None:
                      built = built.replace(tzinfo=timezone.utc)
                  built = built.astimezone(timezone.utc)
                  age = (now - built).total_seconds() / 3600
                  source_exists = bool(source_commit) and subprocess.run(
                      ['git', 'cat-file', '-e', f'{source_commit}^{{commit}}'],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  ).returncode == 0
                  context_newer = not source_exists
                  if source_exists:
                      context_newer = any(
                          subprocess.run(
                              ['git', 'diff', '--quiet', f'{source_commit}..{current_sha}', '--', path],
                              stdout=subprocess.DEVNULL,
                              stderr=subprocess.DEVNULL,
                          ).returncode != 0
                          for path in context_inputs
                      )
                  fresh = (
                      artifact_date == expected_date
                      and age <= 20
                      and not context_newer
                      and str(payload.get('state') or '').lower() in {'success', 'partial'}
                      and str(payload.get('freshness') or '').upper() == 'READY'
                  )
              except Exception:
                  fresh = False
                  context_newer = True
          print(f"forecast_fresh={'true' if fresh else 'false'}")
          print(f"expected_date={expected_date}")
          print(f"artifact_date={artifact_date or ''}")
          print(f"source_commit_sha={source_commit}")
          print(f"current_commit_sha={current_sha}")
          print(f"context_changed_since_source={'true' if context_newer else 'false'}")
          PY

      - name: Install production dependencies
        if: steps.forecast.outputs.forecast_fresh != 'true'
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Validate TennisMyLife history freshness
        if: steps.forecast.outputs.forecast_fresh != 'true'
        run: |
          python - <<'PY'
          import os
          from v5_history_freshness import history_status
          max_age = float(os.environ['V5_HISTORY_MAX_AGE_HOURS'])
          status = history_status('v5_refresh_last.json', max_age_hours=max_age)
          print(status)
          if not status.get('usable'):
              raise SystemExit(f"Player history is too stale for a new official forecast: {status}. Preserving the last known-good production artifacts.")
          PY

      - name: Restore last-known-good context warehouse
        if: steps.forecast.outputs.forecast_fresh != 'true'
        id: context-cache
        uses: actions/cache/restore@v4
        with:
          path: context_warehouse
          key: v5-context-warehouse-${{ github.run_id }}
          restore-keys: |
            v5-context-warehouse-

      - name: Build context warehouse with cached fallback
        if: steps.forecast.outputs.forecast_fresh != 'true'
        id: context_build
        continue-on-error: true
        run: python build_v5_context_warehouse.py

      - name: Stamp fresh context warehouse
        if: steps.forecast.outputs.forecast_fresh != 'true' && steps.context_build.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('context_warehouse/cache_status.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({'status':'SUCCESS','built_at_utc':datetime.now(timezone.utc).isoformat()}, indent=2), encoding='utf-8')
          PY

      - name: Validate context fallback freshness
        if: steps.forecast.outputs.forecast_fresh != 'true'
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          rows = Path('context_warehouse/player_match_rows.parquet')
          status_path = Path('context_warehouse/cache_status.json')
          if not rows.exists() or not status_path.exists(): raise SystemExit('No last-known-good context warehouse is available.')
          payload = json.loads(status_path.read_text(encoding='utf-8'))
          built = datetime.fromisoformat(str(payload.get('built_at_utc') or '').replace('Z', '+00:00'))
          if built.tzinfo is None: built = built.replace(tzinfo=timezone.utc)
          age = (datetime.now(timezone.utc) - built.astimezone(timezone.utc)).total_seconds() / 3600
          max_age = float(os.environ['V5_CONTEXT_MAX_AGE_HOURS'])
          print(f'context_build={"${{ steps.context_build.outcome }}"} age_hours={age:.2f} max_age_hours={max_age:.2f}')
          if age > max_age: raise SystemExit(f'Cached context warehouse is too stale ({age:.2f}h).')
          PY

      - name: Save fresh context warehouse
        if: steps.forecast.outputs.forecast_fresh != 'true' && steps.context_build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: context_warehouse
          key: v5-context-warehouse-${{ github.run_id }}

      - name: Build one sportsbook-independent daily forecast
        if: steps.forecast.outputs.forecast_fresh != 'true'
        run: |
          python v5_daily_batch.py
          python v5_daily_policy_postprocess.py
          python v5_build_daily_forecast_artifacts.py

      - name: Stamp forecast source commit
        if: steps.forecast.outputs.forecast_fresh != 'true'
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          path = Path('v5_daily_ready/forecast_status.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload['source_commit_sha'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(f"forecast source commit: {payload['source_commit_sha']}")
          PY

      - name: Reprice latest valid market snapshot against frozen forecast
        if: steps.forecast.outputs.forecast_fresh != 'true'
        run: python v5_run_repricing.py

      - name: Show production status
        if: always()
        run: |
          for f in v5_daily_ready/latest_summary.json v5_daily_ready/forecast_status.json v5_daily_ready/repricing_status.json; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done

      - name: Commit canonical daily production artifacts safely
        if: success() && steps.forecast.outputs.forecast_fresh != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          build_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('v5_daily_ready/forecast_status.json').read_text(encoding='utf-8'))
          print(payload.get('source_commit_sha') or '')
          PY
          )"
          if [ -z "$build_sha" ]; then
            echo "Missing forecast source commit; refusing to publish untraceable artifacts."
            exit 1
          fi

          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$build_sha" ]; then
            changed_context="$(git diff --name-only "$build_sha..$remote_sha" -- \
              v5_master_schedule_context.py \
              v5_full_context_live.py \
              v5_forecast_context.py \
              build_v5_context_matchups.py \
              build_v5_context_warehouse.py \
              context_registry/tennis_master_schedule.csv \
              .github/workflows/v5_daily_predictions.yml)"
            if [ -n "$changed_context" ]; then
              echo "This run was superseded by newer production context/code. Refusing to publish stale artifacts."
              echo "$changed_context"
              echo "The next scheduled window rebuilds from the newer main; ending this superseded writer cleanly."
              exit 0
            fi
          fi

          for f in \
            v5_daily_ready/latest_board.csv \
            v5_daily_ready/latest_summary.json \
            v5_daily_ready/frozen_predictions.csv \
            v5_daily_ready/daily_forecasts.csv \
            v5_daily_ready/daily_market_probabilities.csv \
            v5_daily_ready/forecast_status.json \
            v5_daily_ready/latest_repriced_board.csv \
            v5_daily_ready/official_recommendations.csv \
            v5_daily_ready/recommendation_audit.csv \
            v5_daily_ready/market_snapshot_history.csv \
            v5_daily_ready/repricing_status.json
          do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then echo "No new daily production artifacts to commit."; exit 0; fi
          git commit -m "Freeze daily V5 forecast and reprice live markets"
          echo "Discarding non-canonical generated worktree changes before rebase:"
          git status --short
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
