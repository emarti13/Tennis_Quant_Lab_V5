name: V5 Daily Predictions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v5_market_ready/**"
      - "v5_production_config.json"
      - "v5_production_policy.py"
      - "v5_daily_policy_postprocess.py"
      - ".github/workflows/v5_daily_predictions.yml"
  workflow_run:
    workflows: ["OddsPapi Normalized Daily v2"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: v5-daily-predictions
  cancel-in-progress: true

jobs:
  build-and-freeze:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run daily batch tests
        run: python -m pytest tests -q

      - name: Build ranked board and freeze pre-match predictions
        run: |
          python v5_daily_batch.py
          python v5_daily_policy_postprocess.py

      - name: Show batch summary
        if: always()
        run: |
          if [ -f v5_daily_ready/latest_summary.json ]; then
            cat v5_daily_ready/latest_summary.json
          fi

      - name: Commit frozen daily board safely
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during prediction build; rerunning against the latest market feed."
            git reset --hard origin/main
            python -m pytest tests -q
            python v5_daily_batch.py
            python v5_daily_policy_postprocess.py
          fi

          git add v5_daily_ready/latest_board.csv \
                  v5_daily_ready/latest_summary.json \
                  v5_daily_ready/frozen_predictions.csv
          if git diff --cached --quiet; then
            echo "No new daily predictions to commit."
          else
            git commit -m "Freeze V5 daily predictions"
            git push origin HEAD:main
          fi
