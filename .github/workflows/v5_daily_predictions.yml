name: V5 Daily Predictions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v5_market_ready/**"
      - ".github/workflows/v5_daily_predictions.yml"

permissions:
  contents: write

concurrency:
  group: v5-daily-predictions
  cancel-in-progress: false

jobs:
  build-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily batch tests
        run: python -m unittest discover -s tests -v

      - name: Build ranked board and freeze pre-match predictions
        run: python v5_daily_batch.py

      - name: Show batch summary
        if: always()
        run: |
          if [ -f v5_daily_ready/latest_summary.json ]; then
            cat v5_daily_ready/latest_summary.json
          fi

      - name: Commit frozen daily board
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v5_daily_ready/latest_board.csv \
                  v5_daily_ready/latest_summary.json \
                  v5_daily_ready/frozen_predictions.csv
          if git diff --cached --quiet; then
            echo "No new daily predictions to commit."
          else
            git commit -m "Freeze V5 daily predictions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
