name: V5 Daily Predictions

# One full-context production forecast per day, plus manual recovery. Routine
# code/data pushes do not launch another heavy model build.
on:
  workflow_dispatch:
  schedule:
    - cron: "45 6 * * *"

permissions:
  contents: write

concurrency:
  group: v5-daily-heavy-forecast
  cancel-in-progress: true

jobs:
  build-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install production dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Rebuild as-of-match context warehouse
        run: python build_v5_context_warehouse.py

      - name: Build ranked board and freeze pre-match predictions
        run: |
          python v5_daily_batch.py
          python v5_daily_policy_postprocess.py

      - name: Show batch summary
        if: always()
        run: |
          if [ -f v5_daily_ready/latest_summary.json ]; then cat v5_daily_ready/latest_summary.json; fi

      - name: Commit frozen daily board safely
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during prediction build; rerunning against latest production inputs."
            git reset --hard origin/main
            python build_v5_context_warehouse.py
            python v5_daily_batch.py
            python v5_daily_policy_postprocess.py
          fi
          git add v5_daily_ready/latest_board.csv \
                  v5_daily_ready/latest_summary.json \
                  v5_daily_ready/frozen_predictions.csv
          if git diff --cached --quiet; then
            echo "No new daily predictions to commit."
          else
            git commit -m "Freeze V5 daily predictions"
            git push origin HEAD:main
          fi
