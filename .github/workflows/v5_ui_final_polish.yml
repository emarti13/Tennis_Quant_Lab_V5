name: V5 Today UI Final Polish

on:
  push:
    branches: [feature/apple-today-ui]
    paths:
      - 'scripts/finalize_today_header.py'
      - '.github/workflows/v5_ui_final_polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final Today polish
        run: python scripts/finalize_today_header.py
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run complete regression and Streamlit smoke suite
        run: python -m pytest tests -q
      - name: Commit verified polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5_ui_today.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: remove duplicate Today heading'
            git push origin HEAD:feature/apple-today-ui
          fi
