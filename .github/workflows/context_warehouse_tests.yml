name: Context Warehouse Tests

on:
  push:
    branches:
      - main
    paths:
      - 'context_warehouse/**'
      - 'tests/test_context_warehouse.py'
      - 'build_context_warehouse.py'
      - '.github/workflows/context_warehouse_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pandas

      - name: Run Stage 1 tests
        run: python -m unittest discover -s tests -p 'test_context_warehouse.py' -v
