name: OddsPapi Normalized Daily v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pull_oddspapi_quota_aware.py"
      - "normalize_oddspapi_snapshot.py"
      - "build_v5_market_board_input.py"
      - "v5_reprice_markets.py"
      - "v5_run_repricing.py"
      - "v5_recommendation_ledger.py"
      - "v5_production_artifacts.py"
      - "tests/test_oddspapi_quota_policy.py"
      - ".github/workflows/oddspapi_normalized_daily_v2.yml"
  schedule:
    # Four lightweight live pulls/repricings, evenly spaced six hours apart.
    - cron: "15 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: oddspapi-live-market-writer
  cancel-in-progress: false

jobs:
  pull-and-reprice:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight dependencies
        run: pip install requests pandas

      - name: Restore cached Tennis market dictionary
        id: market-cache
        uses: actions/cache/restore@v4
        with:
          path: oddspapi_markets_tennis.json
          key: oddspapi-tennis-markets-v1

      - name: Fetch Tennis market dictionary on cache miss
        if: steps.market-cache.outputs.cache-hit != 'true'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python fetch_oddspapi_markets.py

      - name: Cache Tennis market dictionary
        if: steps.market-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: oddspapi_markets_tennis.json
          key: oddspapi-tennis-markets-v1

      - name: Pull quota-aware odds and persist fixture IDs
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python pull_oddspapi_quota_aware.py

      - name: Normalize ML, game spreads and total games
        run: python normalize_oddspapi_snapshot.py

      - name: Build V5-ready market feed
        run: python build_v5_market_board_input.py

      - name: Validate feed before promotion
        run: |
          python - <<'PY'
          import csv
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('v5_market_ready/market_board_input.csv')
          if not path.exists() or path.stat().st_size == 0:
              raise SystemExit('Refusing to promote missing/empty market feed')
          with path.open(newline='', encoding='utf-8') as fh:
              rows = list(csv.DictReader(fh))
          if not rows:
              raise SystemExit('Refusing to promote market feed with zero rows')
          now = datetime.now(timezone.utc)
          def parse(value):
              return datetime.fromisoformat(str(value).replace('Z', '+00:00'))
          snapshots = [parse(r['snapshot_utc']) for r in rows if r.get('snapshot_utc')]
          if not snapshots:
              raise SystemExit('Refusing to promote feed without snapshot timestamp')
          age_hours = (now - max(snapshots)).total_seconds() / 3600
          if age_hours > 3:
              raise SystemExit(f'Refusing to promote stale feed: {age_hours:.2f}h old')
          future = [r for r in rows if r.get('start_time_utc') and parse(r['start_time_utc']) > now]
          fixtures = {r.get('fixture_id') for r in future if r.get('fixture_id')}
          if not fixtures:
              raise SystemExit('Refusing to promote feed with zero future fixtures')
          print(f'Feed validation OK: age={age_hours:.2f}h future_fixtures={len(fixtures)} rows={len(future)}')
          PY

      - name: Reprice against frozen daily model forecast
        run: python v5_run_repricing.py

      - name: Commit live feed and lightweight production artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            oddspapi_registry/fixtures.csv \
            v5_market_ready/market_board_input.csv \
            v5_market_ready/all_book_prices.csv \
            v5_market_ready/market_feed_qc.json
          for f in \
            v5_daily_ready/latest_repriced_board.csv \
            v5_daily_ready/official_recommendations.csv \
            v5_daily_ready/recommendation_audit.csv \
            v5_daily_ready/market_snapshot_history.csv \
            v5_daily_ready/repricing_status.json
          do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No live-feed or repricing changes to commit."
          else
            git commit -m "Refresh live market prices and V5 repricing"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload live-feed audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-normalized-market-snapshot
          path: |
            oddspapi_daily/
            oddspapi_normalized/
            oddspapi_markets_tennis.json
            oddspapi_registry/
            v5_market_ready/
            v5_daily_ready/repricing_status.json
          if-no-files-found: warn
          retention-days: 3
