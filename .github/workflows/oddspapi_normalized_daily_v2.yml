name: OddsPapi Normalized Daily v2

# Production-critical live pricing. One scheduled production refresh/day at
# 00:02 UTC establishes the canonical market snapshot for the production day.
# Daily Board and Decision Feed consume the same promoted snapshot/repricing
# artifacts. Last-known-good pricing remains actionable until it is >24h old.
on:
  workflow_dispatch:
  schedule:
    - cron: "2 0 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: v5-production-writer
  cancel-in-progress: false

jobs:
  pull-and-reprice:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lightweight dependencies
        run: pip install --disable-pip-version-check requests pandas

      - name: Restore cached Tennis market dictionary
        id: market-cache
        uses: actions/cache/restore@v4
        with:
          path: oddspapi_markets_tennis.json
          key: oddspapi-tennis-markets-v1

      - name: Fetch Tennis market dictionary on cache miss
        if: steps.market-cache.outputs.cache-hit != 'true'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python fetch_oddspapi_markets.py

      - name: Cache Tennis market dictionary
        if: steps.market-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: oddspapi_markets_tennis.json
          key: oddspapi-tennis-markets-v1

      - name: Pull quota-aware odds and persist fixture IDs
        id: live_pull
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python pull_oddspapi_quota_aware.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          manifests = sorted(Path('oddspapi_daily').glob('*_manifest.json'))
          if not manifests:
              raise SystemExit('Live pull did not produce a manifest')
          payload = json.loads(manifests[-1].read_text(encoding='utf-8'))
          status = str(payload.get('status') or 'UNKNOWN')
          print(f"pull_status={status}")
          print(f"fresh_snapshot={'true' if status == 'SUCCESS' else 'false'}")
          PY

      - name: Preserve last-known-good feed when live quota is unavailable
        if: steps.live_pull.outputs.fresh_snapshot != 'true'
        run: |
          echo "No fresh OddsPapi snapshot: ${{ steps.live_pull.outputs.pull_status }}"
          echo "Preserving canonical last-known-good market and repricing artifacts."

      - name: Normalize ML, game spreads and total games
        if: steps.live_pull.outputs.fresh_snapshot == 'true'
        run: python normalize_oddspapi_snapshot.py

      - name: Build V5-ready market feed
        if: steps.live_pull.outputs.fresh_snapshot == 'true'
        run: python build_v5_market_board_input.py

      - name: Validate feed before promotion
        if: steps.live_pull.outputs.fresh_snapshot == 'true'
        run: |
          python - <<'PY'
          import csv
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('v5_market_ready/market_board_input.csv')
          if not path.exists() or path.stat().st_size == 0:
              raise SystemExit('Refusing to promote missing/empty market feed')
          with path.open(newline='', encoding='utf-8') as fh:
              rows = list(csv.DictReader(fh))
          if not rows:
              raise SystemExit('Refusing to promote market feed with zero rows')
          now = datetime.now(timezone.utc)
          def parse(value):
              return datetime.fromisoformat(str(value).replace('Z', '+00:00'))
          snapshots = [parse(r['snapshot_utc']) for r in rows if r.get('snapshot_utc')]
          if not snapshots:
              raise SystemExit('Refusing to promote feed without snapshot timestamp')
          age_hours = (now - max(snapshots)).total_seconds() / 3600
          if age_hours > 3:
              raise SystemExit(f'Refusing to promote stale feed: {age_hours:.2f}h old')
          future = [r for r in rows if r.get('start_time_utc') and parse(r['start_time_utc']) > now]
          fixtures = {r.get('fixture_id') for r in future if r.get('fixture_id')}
          if not fixtures:
              raise SystemExit('Refusing to promote feed with zero future fixtures')
          print(f'Feed validation OK: age={age_hours:.2f}h future_fixtures={len(fixtures)} rows={len(future)}')
          PY

      - name: Reprice against frozen daily model forecast
        if: steps.live_pull.outputs.fresh_snapshot == 'true'
        run: python v5_run_repricing.py

      - name: Commit live feed and lightweight production artifacts
        if: steps.live_pull.outputs.fresh_snapshot == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            oddspapi_registry/fixtures.csv \
            v5_market_ready/market_board_input.csv \
            v5_market_ready/all_book_prices.csv \
            v5_market_ready/market_feed_qc.json
          for f in \
            v5_daily_ready/latest_repriced_board.csv \
            v5_daily_ready/official_recommendations.csv \
            v5_daily_ready/recommendation_audit.csv \
            v5_daily_ready/market_snapshot_history.csv \
            v5_daily_ready/repricing_status.json
          do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No live-feed or repricing changes to commit."
          else
            git commit -m "Refresh live market prices and V5 repricing"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Trigger daily forecast after fresh market promotion
        if: steps.live_pull.outputs.fresh_snapshot == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v5_daily_predictions.yml --ref main -R emarti13/Tennis_Quant_Lab_V5

      - name: Upload compact live-feed audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-live-market-status
          path: |
            oddspapi_daily/*_manifest.json
            v5_market_ready/market_feed_qc.json
            v5_daily_ready/repricing_status.json
          if-no-files-found: warn
          retention-days: 2
