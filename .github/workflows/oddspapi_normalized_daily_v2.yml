name: OddsPapi Normalized Daily v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pull_oddspapi_quota_aware.py"
      - "tests/test_oddspapi_quota_policy.py"
      - ".github/workflows/oddspapi_normalized_daily_v2.yml"
  schedule:
    # One quota-budgeted pull per day. During EDT this is 8:15 AM Eastern.
    - cron: "15 12 * * *"

permissions:
  contents: write

concurrency:
  group: oddspapi-fixture-registry-writer
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Restore cached Tennis market dictionary
        id: market-cache
        uses: actions/cache/restore@v4
        with:
          path: oddspapi_markets_tennis.json
          key: oddspapi-tennis-markets-v1

      - name: Fetch Tennis market dictionary on cache miss
        if: steps.market-cache.outputs.cache-hit != 'true'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python fetch_oddspapi_markets.py

      - name: Cache Tennis market dictionary
        if: steps.market-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: oddspapi_markets_tennis.json
          key: oddspapi-tennis-markets-v1

      - name: Pull quota-aware odds and persist fixture IDs
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python pull_oddspapi_quota_aware.py

      - name: Normalize ML, game spreads and total games
        run: python normalize_oddspapi_snapshot.py

      - name: Build V5-ready market feed immediately
        run: python build_v5_market_board_input.py

      - name: Commit market feed and permanent fixture registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            oddspapi_registry/fixtures.csv \
            v5_market_ready/market_board_input.csv \
            v5_market_ready/all_book_prices.csv \
            v5_market_ready/market_feed_qc.json
          if git diff --cached --quiet; then
            echo "No market-feed or fixture-registry changes to commit."
          else
            git commit -m "Update V5 market feed and OddsPapi fixture registry"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload normalized snapshot and V5-ready feed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-normalized-market-snapshot
          path: |
            oddspapi_daily/
            oddspapi_normalized/
            oddspapi_markets_tennis.json
            oddspapi_registry/
            v5_market_ready/
          if-no-files-found: warn
