name: V5 Joint Score Distribution Calibration

on:
  push:
    branches:
      - main
    paths:
      - "diagnose_joint_score_distribution_calibration.py"
      - "historical_score_calibration.py"
      - "v5_strength_conditioning.py"
      - "v5_core.py"
      - ".github/workflows/v5_joint_score_calibration_diagnostic.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fit 2025 joint score distribution and validate on 2026
        run: python diagnose_joint_score_distribution_calibration.py
      - name: Show diagnostic
        run: cat v5_daily_ready/joint_score_calibration_diagnostic.json
