name: V5 Venue Metadata

on:
  push:
    branches: [main]
    paths:
      - 'v5_venue_metadata.py'
      - 'build_v5_venue_registry.py'
      - 'tests/test_v5_venue_metadata.py'
      - 'tests/test_build_v5_venue_registry.py'
      - '.github/workflows/v5_venue_metadata.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_v5_venue_metadata.py tests/test_build_v5_venue_registry.py -v
