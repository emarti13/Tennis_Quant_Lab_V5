name: Audit Production Handoff

on:
  push:
    paths:
      - "scripts/audit_production_handoff.py"
      - ".github/workflows/audit_production_handoff.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pandas numpy
      - name: Run handoff audit
        run: python scripts/audit_production_handoff.py
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: production-handoff-audit
          path: exports/production_handoff_audit.json
          retention-days: 7
      - name: Commit audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/production_handoff_audit.json
          if git diff --cached --quiet; then
            echo "No audit changes."
          else
            git commit -m "Refresh production handoff audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
