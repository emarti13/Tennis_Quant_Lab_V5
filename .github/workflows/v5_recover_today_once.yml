name: V5 One-Time Forecast Recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v5_recover_today_once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical daily predictions workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v5_daily_predictions.yml --ref main
