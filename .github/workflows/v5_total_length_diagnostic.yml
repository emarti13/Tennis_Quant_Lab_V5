name: V5 Total Length Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - "diagnose_total_length_calibration.py"
      - ".github/workflows/v5_total_length_diagnostic.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fit 2025 score-length offset and validate on 2026
        run: python diagnose_total_length_calibration.py
      - name: Show diagnostic
        run: cat v5_daily_ready/total_length_calibration_diagnostic.json
