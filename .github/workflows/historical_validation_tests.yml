name: Historical Validation Tests

on:
  push:
    branches:
      - main
      - feature/modular-historical-backtest
    paths:
      - "historical_*.py"
      - "tests/test_historical_validation_modules.py"
      - ".github/workflows/historical_validation_tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model dependencies
        run: pip install numpy pandas scipy
      - name: Run historical validation unit tests
        run: python -m unittest discover -s tests -p 'test_historical_validation_modules.py' -v
      - name: Compile historical modules
        run: python -m py_compile historical_odds_normalizer.py historical_fixture_matcher.py historical_state_replay.py historical_backtest_engine.py historical_v5_replay.py
