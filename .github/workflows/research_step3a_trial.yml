name: Research - Step 3a price store trial

# One-off trial on real data before the price-store PR. Runs only on pushes to its own
# research branch (never merged) and commits its outputs back to that branch.
on:
  push:
    branches: [research/step3a-trial]
    paths: [.github/workflows/research_step3a_trial.yml]

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check requests pandas
      - name: Restore cached Tennis market dictionary
        uses: actions/cache/restore@v4
        with:
          path: oddspapi_markets_tennis.json
          key: oddspapi-tennis-markets-v1
      - name: Stored chunk 4 (no API)
        run: python scripts/pull_market_history.py --stored-chunks 4-4 && cp market_history/run_status.json market_history/run_status_stored.json
      - name: Live API, 3 minutes
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python scripts/pull_market_history.py --max-minutes 3
      - name: Commit to the research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp oddspapi_markets_tennis.json market_history/markets_dictionary_trial.json || true
          git add -f market_history oddspapi_registry/fixtures.csv
          git reset -q market_history/raw
          git commit -m "Step 3a trial outputs" && git push origin HEAD:research/step3a-trial
