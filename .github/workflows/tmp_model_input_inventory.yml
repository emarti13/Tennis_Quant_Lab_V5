name: Temporary Model Input Inventory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp_model_input_inventory.yml"
      - "scripts/tmp_export_model_input_inventory.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build inventory bundle
        run: python scripts/tmp_export_model_input_inventory.py

      - name: Upload inventory bundle
        uses: actions/upload-artifact@v4
        with:
          name: tennis-model-input-inventory
          path: model_input_inventory
          retention-days: 7
